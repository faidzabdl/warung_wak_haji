services:

  # ─── Frontend — Vue 3 Static Site (Render) ─────────────────────────────────
  # Backend di-deploy terpisah di Railway (lihat README bagian 9)
  - type: static
    name: warung-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      # SPA fallback — semua path dikembalikan ke index.html
      # (diperlukan karena Vue Router pakai history mode)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Isi nilai berikut di Render Dashboard → warung-frontend → Environment
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # URL backend Railway, contoh: https://warung-backend.up.railway.app
      - key: VITE_API_URL
        sync: false
